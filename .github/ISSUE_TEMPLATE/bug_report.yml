name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: workspace
    attributes:
      label: Workspace layout
      description: The `workspaces` field of your root package.json and roughly how many packages you have.
      render: jsonc
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Bun Companion, VS Code (or Cursor, Windsurf, VSCodium), Bun, OS"
      placeholder: "Bun Companion 0.1.0, VS Code 1.146, Bun 1.4.4, macOS 15"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: 'Output of the "Bun Companion: Show Log" command'
      render: text
