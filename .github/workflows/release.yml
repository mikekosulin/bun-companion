name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require(`./package.json`).version')" = "$GITHUB_REF_NAME"
      - run: bun run check
      - run: bun run package
      - name: Publish to the Visual Studio Marketplace (trusted publishing, no token)
        run: ./node_modules/.bin/vsce publish --oidc --no-dependencies --packagePath dist/bun-companion.vsix
      - name: Attach the vsix to the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/bun-companion.vsix --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      # Open VSX only accepts trusted publishing for extensions that already exist there, so the first
      # version is uploaded by hand; set the repository variable once the trusted publisher is registered.
      - name: Publish to Open VSX (trusted publishing, no token)
        if: vars.OPENVSX_TRUSTED_PUBLISHING == 'true'
        run: bunx ovsx@1.4.0 publish dist/bun-companion.vsix --trusted-publishing --skip-duplicate
